<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E86DE"/>
      <stop offset="100%" stop-color="#1B5FA8"/>
    </linearGradient>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEFFF"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado tipo ícono de app -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- Gota de agua principal -->
  <path
    d="M32 12
       C 32 12, 46 30, 46 40
       C 46 48.5, 39.7 55, 32 55
       C 24.3 55, 18 48.5, 18 40
       C 18 30, 32 12, 32 12
       Z"
    fill="url(#dropGradient)"
  />

  <!-- Silueta de montaña dentro de la gota, referencia a la cuenca -->
  <path
    d="M22.5 43
       L28 34
       L32.5 40
       L37 32
       L43.5 43
       Z"
    fill="#2E86DE"
    opacity="0.55"
  />

  <!-- Brillo sutil en la gota -->
  <ellipse cx="27" cy="30" rx="2.4" ry="4" fill="#FFFFFF" opacity="0.8"/>
</svg>
